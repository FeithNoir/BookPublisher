[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bookpublisher"
version = "0.1.0"
description = "Estudio de maquetación de libros: importa PDF a Markdown/Word y exporta a PDF con temas, rápido incluso en libros de mil páginas."
readme = "README.md"
license = "MIT"
authors = [{ name = "Feith Noir" }]
requires-python = ">=3.11"
dependencies = [
  "typst>=0.14",
  "pymupdf>=1.26",
  "python-docx>=1.1",
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
  "pyyaml>=6.0",
  "pillow>=10",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "psutil>=5.9", "pypdf>=4"]

[project.scripts]
bookpublisher = "bookpublisher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bookpublisher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
